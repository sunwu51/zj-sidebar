[package]
name = "zjsb-helper"
version = "0.1.0"
edition = "2024"
description = "Native helper for zj-sidebar: lists Codex threads and finds running agent sessions"
license = "MIT"
repository = "https://github.com/sunwu51/zj-sidebar"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Wdk_System_Threading",
] }

[profile.release]
opt-level = "s"
strip = true
